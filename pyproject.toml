[project]
name = "quadweld"
version = "0.1.0"
description = "Automatic 3D weld detection from RGB using DA3 and SAM3"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.8,<4",
    "numpy>=1.26.4,<3",
    "opencv-python-headless==4.13.0.90",
    "pillow>=10.2,<13",
    "scipy>=1.13,<2",
]

[project.optional-dependencies]
# Optional bindings for importing the industrial welding scene from RoboSimStudio.
usd = ["usd-core>=25.5,<27"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
